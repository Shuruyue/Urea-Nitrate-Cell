name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 會抓到 Linux 看不到的編碼問題（非 UTF-8 的預設檔案／主控台編碼）
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests and full validation (pytest)
        run: pytest -q
      - name: Validation table (47 checks, fails the job on any FAIL)
        run: python scripts/validate.py
      - name: Main results
        run: python scripts/summary.py
